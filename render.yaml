services:
  - type: web
    name: duplicate-repair-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: duplicate-repair-db
          property: connectionString

databases:
  - name: duplicate-repair-db
    databaseName: duplicaterepairdb
    user: duplicaterepairuser
    plan: free
